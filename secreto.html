<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT'S ME</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #ff0000;
      font-family: monospace;
    }

   
    #jumpscare-img {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;  
  height: 100vh; 
  object-fit: cover; 
  animation: shake 0.1s infinite alternate;
}

    
    #crash-screen {
      display: none;
      text-align: center;
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 5px;
    }
  </style>
</head>
<body>

 
  <img id="jumpscare-img" src="Imagens/GoldenFreddy.jpg" alt="IT'S ME">

  
  <div id="crash-screen">
    <p>FATAL ERROR: IT'S ME</p>
    <p style="font-size: 1rem; color: #555; margin-top: 15px;">Fechando aplicação...</p>
  </div>

 
  <audio id="screamer" autoplay>
    <source src="Sons/jumpscare.mp3" type="audio/mpeg">
  </audio>

  <script>
    const img = document.getElementById('jumpscare-img');
    const crashScreen = document.getElementById('crash-screen');
    const audio = document.getElementById('screamer');

   
    window.addEventListener('load', () => {
      audio.play().catch(() => {});
    });

    
    setTimeout(() => {
      img.style.display = 'none';
      crashScreen.style.display = 'block';

      setTimeout(() => {
        // Tenta fechar a aba
        window.close();

        
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);
      }, 1200);

    }, 1800);
  </script>
</body>
</html>
